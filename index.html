<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1b1a17">
<title>中国象棋 · 无服务器联机</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header>
    <h1>中国象棋</h1>
    <select id="mode">
      <option value="local">本地双人</option>
      <option value="mqtt" selected>联机</option>
    </select>
  </header>

  <div class="bar" id="netRow">
    <input id="room" placeholder="房间号" maxlength="24" autocomplete="off" spellcheck="false">
    <button id="btnRand" class="ghost" title="换一个房间号">换</button>
    <button id="btnRed" class="sideBtn">执红</button>
    <button id="btnBlack" class="sideBtn">执黑</button>
    <button id="btnChat" class="ghost" title="聊天">💬</button>
  </div>

  <div id="stat"><span class="dot" id="dot"></span><span id="statText"></span></div>

  <div id="boardWrap">
    <canvas id="board"></canvas>
    <div id="flash"></div>
    <div id="banner"><div class="t"></div></div>
  </div>

  <div id="ask">
    <span id="askText"></span>
    <button id="askYes" class="primary">同意</button>
    <button id="askNo">拒绝</button>
  </div>

  <div class="actions" id="actLocal">
    <button id="btnNew">重开</button>
    <button id="btnUndo">悔棋</button>
    <button id="btnCopy">复制棋谱</button>
  </div>
  <div class="actions" id="actOnline">
    <button id="btnResign">认输</button>
    <button id="btnDraw">求和</button>
    <button id="btnUndoReq">悔棋</button>
  </div>

  <div id="legend"><i class="lg g"></i>可吃<i class="lg y"></i>假根<i class="lg r"></i>危险</div>

  <div id="chat" class="off">
    <div id="chatLog"></div>
    <div class="bar">
      <input id="chatIn" maxlength="80" placeholder="说点什么" autocomplete="off">
      <button id="chatSend">发送</button>
    </div>
  </div>

  <div id="log"></div>
</div>

<script src="engine.js"></script>
<script src="mate.js"></script>
<script src="mqtt.js"></script>
<script src="app.js"></script>
</body>
</html>
